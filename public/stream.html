<!DOCTYPE html>
<html>

<head>
    <title>Multiparty Chatroom</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, minimum-scale=1, maximum-scale=1">
    <script src="/socket.io/socket.io.js"></script>
    <script type="text/javascript" src="libs/easyrtc.min.js"></script>
    <script>
        const maxCALLERS = 3;

        function callEverybodyElse(roomName, otherPeople, c) {
            console.log({roomName, otherPeople, c});
            easyrtc.setRoomOccupantListener(null); // so we're only called once.

            var list = [];
            var connectCount = 0;
            for (var easyrtcid in otherPeople) {
                list.push(easyrtcid);
            }

            function establishConnection(position) {
                function callSuccess() {
                    connectCount++;
                    if (connectCount < maxCALLERS && position > 0) {
                        establishConnection(position - 1);
                    }
                }
                function callFailure(errorCode, errorText) {
                    easyrtc.showError(errorCode, errorText);
                    if (connectCount < maxCALLERS && position > 0) {
                        establishConnection(position - 1);
                    }
                }
                easyrtc.call(list[position], callSuccess, callFailure);

            }
            if (list.length > 0) {
                establishConnection(list.length - 1);
            }
        }


        function appInit() {
            easyrtc.setSocketUrl("", {});
            easyrtc.setRoomOccupantListener(callEverybodyElse);
            easyrtc.easyApp("stream.multiparty", "box0", ["box1", "box2", "box3"], ()=>{});
            easyrtc.setDisconnectListener(()=> easyrtc.showError("LOST-CONNECTION", "Lost connection to signaling server"));
            easyrtc.setOnCall(function (easyrtcid, slot) {
                console.log('Connected', easyrtcid)
                console.log("getConnection count=" + easyrtc.getConnectionCount());
            });
        }
    </script>

</head>



<body onload="appInit()">
    <div id="fullpage">
        <video id="box0" class="transit boxCommon thumbCommon easyrtcMirror" muted="muted" volume="0"
            autoplay="autoplay" playsinline="playsinline"></video>
        <video id="box1" class="transit boxCommon thumbCommon" style="visibility:hidden" autoplay="autoplay"
            playsinline="playsinline"></video>
        <video id="box2" class="transit boxCommon thumbCommon" style="visibility:hidden" autoplay="autoplay"
            playsinline="playsinline"></video>
        <video id="box3" class="transit boxCommon thumbCommon" style="visibility:hidden" autoplay="autoplay"
            playsinline="playsinline"></video>
    </div>
</body>
<style>
    #fullpage video {
        display: inline-block;
        height: 500px;
        border: 1px solid;
        visibility: visible !important;
    }
    #box0 {
        position: fixed;
        top: 0;
        right: 0;
        width: 200px! important;
    }
</style>


</body>

</html>
