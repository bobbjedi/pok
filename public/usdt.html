<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>USDT</title>
    <script src="https://ru.vuejs.org/js/vue.js"></script>
</head>

<body>
    <div id="app">
        <textarea v-model="seed" v-if="!info.address" placeholder="Seed фраза"></textarea>
        <div class="">
            <div><span class="w100">Address:</span> {{info.address}}</div>
            <div><span class="w100">Balance ETH:</span> {{info.balanceEth}}</div>
            <div><span class="w100">Balance USDT:</span> {{info.balanceUsdt}}</div>
        </div>
    </div>

    <script>
        const app = new Vue({
            el: '#app',
            data: {
                seed,
                info: {
                    address: null,
                    balanceUsdt: 0,
                    balanceEth: 0
                }
            },
            computed: {
              
            },
            created() {
              
            },
            methods: {
                createCosh(){
                    api({action: 'createCosh', data: {seed: this.seed}}, data => {
                        // console.log(data);
                      this.info = data;
                    });
                }
            }
        });

        function api(obj, cb = () => {}) {
            obj.data = obj.data || {};
            obj.data.token = localStorage.getItem('token');
            fetch('/adminsplurgeola?action=' + obj.action + '&data=' + JSON.stringify(obj.data))
                .then(res => {
                    res.json().then(data => {
                        console.log('Resp:', obj.action + ' -> ', data);
                        if (data.success) {
                            cb(data.result);
                        } else {
                            console.warn(obj.action + ' error: ', data);
                        }
                    });
                })
                .catch(function (err) {
                    console.warn(obj.action, err);
                });
        };

    function fullTime(u) {
        return new Date(u).toLocaleString();
    }
</script>
</body>
