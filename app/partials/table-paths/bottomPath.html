<div class="controls" ng-click="countAutoMoves = 0">
    <div class="chat-cell">
        <div id="chat" ng-controller="ChatController">
            <div id="chat-tabs">
                <div class="chat-tab hovered" ng-class="{'bg-blue': isShowSystem}" ng-click="isShowSystem = !isShowSystem">System</div>
                <div class="chat-tab hovered" ng-class="{'bg-blue': isShowMessages}" ng-click="isShowMessages = !isShowMessages">Chat</div>
            </div>
            <div id="messages">
                    <div ng-repeat="msg in messages" ng-show="isShowMessages && msg.type === 'msg' || isShowSystem && msg.type === 'system'" ng:bind-html="renderHtml(msg.html)"></div>
            </div>
            <form ng-submit="sendMessage()">
                <input type="text" ng-model="messageText" placeholder="Message">
                <input class="chat-send-msg" type="submit" value="↵">
            </form>
        </div>
    </div>
    <div class="button-control">
        <button class="control-button" ng-click="fold()" ng-if="showFoldButton()">Fold</button>
        <!-- <button class="control-button" ng-click="postBlind(false)"
            ng-show="actionState === 'postSmallBlind' || actionState === 'postBigBlind'">Отказаться</button> -->
        <button class="control-button" ng-click="leaveTable()" ng-show="showLeaveTableButton()">Покинуть стол</button>
    </div>
    <div class="button-control">
        <button class="control-button" ng-click="showBuyInModal()" ng-show="showButtonBuyInGame()">Купить фишек</button>
        <!-- <button class="control-button" ng-click="sitIn()"
            ng-show="$root.sittingOnTable !== null && !$root.sittingIn">Вернуться</button>
        <button class="control-button" ng-click="postBlind(true)" ng-show="actionState === 'postSmallBlind'">Small
            Blind ({{table.smallBlind}})</button>
        <button class="control-button" ng-click="postBlind(true)" ng-show="actionState === 'postBigBlind'">Big Blind
            ({{table.bigBlind}})
        </button> -->
        <button class="control-button" ng-click="check()" ng-if="showCheckButton()">Check</button>
        <button class="control-button" ng-click="call()" ng-if="showCallButton()">Call {{round(callAmount())}}</button>
    </div>
    <div class="button-control">
        <button class="control-button" ng-class="{'bg-red': (betAmount < minBetAmount())}" ng-click="(betAmount >= minBetAmount()) && bet()" ng-show="showBetButton()">Bet {{round(betAmount)}}</button>
        <button class="control-button" ng-class="{'bg-red': (betAmount < minBetAmount())}" ng-click="(betAmount >= minBetAmount()) && raise()" ng-show="showRaiseButton()">Raise to
            {{round(betAmount)}}</button>
    </div>
    <div class="block-buttons-bet" ng-show="showBetRange()">

        <!-- Префлоп -->
        <div class="buttons-bet" ng-show="potAmount() / 3 < table.bigBlind">
            <div class="button-bet hovered" ng-click="betAmount = round(minBetAmount())">Min.</div>
            <div class="button-bet hovered" ng-click="betAmount = round(table.bigBlind * 3)">3xBB</div>
            <div class="button-bet hovered" ng-click="betAmount = round(potAmount() || table.bigBlind * 5)">
                {{potAmount() ? 'Банк' : '5xBB'}}</div>
            <div class="button-bet hovered" ng-click="betAmount = maxBetAmount()">Max.</div>
        </div>

        <!-- ФЛОП -->
        <div class="buttons-bet" ng-show="potAmount() / 3 >= table.bigBlind">
            <div class="button-bet hovered" ng-click="betAmount = round(minBetAmount() + potAmount() / 3 - 0.99 * table.bigBlind)">1/3</div>
            <div class="button-bet hovered" ng-click="betAmount = round(minBetAmount() + potAmount() / 2 - 0.99 * table.bigBlind)">1/2</div>
            <div class="button-bet hovered" ng-click="betAmount = round(minBetAmount() + potAmount() - 0.99 * table.bigBlind)">Pot</div>
            <div class="button-bet hovered" ng-click="betAmount = maxBetAmount()">Max.</div>
        </div>


        <div class="range-input">
            <input
                id="bet-input"
                type="number"
                ng-model="betAmount"
                step="table.bigBlind">
            <div class="button-range but hovered range-red" ng-click="betAmount = round(betAmount - table.bigBlind)">-</div>

            <input
                id = "range-el"
                type ="range"
                min = "{{round(minBetAmount())}}"
                max = "{{maxBetAmount()}}"
                step = "{{table.bigBlind}}"
                oninput = "onRange(this)"
                >

            <div class="button-range but range-green hovered" ng-click="betAmount = round(betAmount + table.bigBlind)">+</div>
        </div>
    </div>
</div>
