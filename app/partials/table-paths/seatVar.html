<seat
    player="table.seats[%s%]"
    active-seat="table.activeSeat"
    dealer-seat="table.dealerSeat"
    my-seat="mySeat"
    my-cards="myCards"
    sitting-on-table="$root.sittingOnTable"
    show-buy-in-modal="showBuyInModal(seat)"
    notifications="notifications"
    phase="table.phase"
    table-scope="this"
    is-mtt="!!table.data.mtt"
    seat-index="%s%"
    cell-number="%c%"
    class="%class%"
    >
</seat>
