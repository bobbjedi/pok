<div class="player-wrap" ng-class="{'no-hand': !player.inHand}">
    <div class="player-cards" ng-show="player.inHand || isMe(seatIndex)" ng-class="{dealt: player.hasCards || isMe(seatIndex) && !phase.includes('Blind')}">
        <div class="card" ng-show="seatOccupied(seatIndex)" ng-class="getCardClass( seatIndex, 0 ) + ' ' + $root.settings.cardColors"></div>
        <div class="card" ng-show="seatOccupied(seatIndex)" ng-class="getCardClass( seatIndex, 1 ) + ' ' + $root.settings.cardColors"></div>
    </div>
    <div class="seat" ng-show="seatOccupied(seatIndex)" 
    ng-class="{
        me: isMe(seatIndex),
        active: activeSeat===seatIndex,
        winner: $root.winnerName && $root.winnerName === player.name
    }">
            <div ng-show="player.name" class="avatar-img-seat">
                <img ng-src="{{'/avatars/' + player.name + '.jpg'}}" onerror="generateRndAvatar(this)" alt="ava-user">
            </div>
        <!-- Таймер -->
        <div class="time-out" ng-show="activeSeat === seatIndex && $root.timeOutCurrent >=0 && !$root.winnerMsgArr.length">
            <span class="img_animate red-cheap"></span>&#160;{{$root.timeOutCurrent}}s
        </div>

        <!-- Выигрыш -->
        <div class="time-out txt-green" ng-show="$root.winnersData[player.name]">+{{$root.winnersData[player.name].amount}}</div>

        <a class="sitIn" ng-show="!player.name" ng-click="showBuyInModal( {seat:seatIndex} )">Занять место</a>
        <div class="player-content" ng-show="player.name">
            <div ng-show="!notifications[seatIndex].message">
                <span class="txt-blue small">{{player.lastAct}}</span> 
                <span ng-class="{me:isMe(seatIndex)}">{{player.name}}</span>
                <div class="tin-line-player"></div>
                <span ng-show="player.sittingIn" class="txt-yellow deposit">{{$root.round(player.chipsInPlay)}}</span>
                <span ng-show="!player.sittingIn">sit Out</span>
            </div>
            <div ng-show="notifications[seatIndex].message">
                <span class="notification txt-blue big">{{notifications[seatIndex].message}}</span>
            </div>
        </div>
    </div>
    <div id="dealer-wrap-{{cellNumber}}" class="dealer-button txt-white" ng-show="dealerSeat===seatIndex">D</div>
    <div id="bets-{{cellNumber}}" class="bets">
        <span ng-show="player.bet"><div class=""><img src="/images/cheap.png" alt="chip">&nbsp;{{$root.round(player.bet)}}</span>
    </div>
</div>
